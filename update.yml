name: Auto Trending News

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

- uses: actions/checkout@v4
- uses: actions/setup-node@v4
  with:
    node-version: '20'

      - name: Install Dependencies
        run: npm install node-fetch

      - name: Run News Bot Script
        env:
          GEMINI_API_KEY: AQ.Ab8RN6Iy1LPugtam4mh4dHAa0fpT_ryvMYmfkVkWfNVDZZVHKQ
        run: node scripts/fetch-news.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "News Bot"
          git config --global user.email "bot@github.com"
          git add news.json
          git commit -m "Auto-update AI news [skip ci]" || exit 0
          git push
