name: Update News

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch and analyze news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run update-news

      - name: Commit updated news
        run: |
          git config user.name "News Express Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No new news to commit."
          else
            git commit -m "Update news archive"
            git push
          fi
