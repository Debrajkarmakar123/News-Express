```yaml
name: Update News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show Node version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Update news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run update-news

      - name: Save news archive
        run: |
          git config user.name "News Express Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No new news to save."
          else
            git commit -m "Update news archive"
            git push
          fi
```
