<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>News-Express</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #171717;
      line-height: 1.8;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
    }

    .back {
      display: inline-block;
      margin-top: 8px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .article {
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.06);
    }

    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .category {
      color: #2563eb;
      font-weight: bold;
    }

    h1 {
      font-size: 40px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .summary {
      font-size: 19px;
      color: #4b5563;
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid #e5e7eb;
    }

    .key-points {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .key-points h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .key-points li {
      margin-left: 20px;
      margin-bottom: 6px;
    }

    .article-body {
      font-size: 18px;
      color: #242424;
      white-space: pre-line;
    }

    .article-body h2 {
      font-size: 25px;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .tag {
      background: #eef2ff;
      color: #3730a3;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    .error,
    .loading {
      background: white;
      padding: 35px;
      border-radius: 15px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 650px) {

      .article {
        padding: 22px;
      }

      h1 {
        font-size: 29px;
      }

      .summary {
        font-size: 17px;
      }

      .article-body {
        font-size: 17px;
      }

    }
  </style>

</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      News-Express
    </div>

    <a
      href="index.html"
      class="back"
    >
      ← Back to Latest News
    </a>

  </div>
</header>

<main>

  <div
    id="article-container"
    class="loading"
  >
    Loading article...
  </div>

</main>

<footer>
  © 2026 News-Express
</footer>

<script>

  const container =
    document.getElementById(
      "article-container"
    );

  function escapeHTML(value = "") {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(date) {

    const d = new Date(date);

    if (Number.isNaN(d.getTime())) {
      return "";
    }

    return d.toLocaleDateString(
      "en-IN",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );
  }

  function formatArticle(text = "") {

    const escaped =
      escapeHTML(text);

    return escaped
      .replace(
        /^## (.+)$/gm,
        "<h2>$1</h2>"
      );
  }

  const params =
    new URLSearchParams(
      window.location.search
    );

  const articleId =
    params.get("id");

  if (!articleId) {

    container.innerHTML = `
      <div class="error">
        Article not found.
      </div>
    `;

  } else {

    fetch("news.json", {
      cache: "no-store"
    })
      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Could not load news."
          );
        }

        return response.json();
      })

      .then(news => {

        const article =
          news.find(
            item =>
              item.id === articleId
          );

        if (!article) {

          container.innerHTML = `
            <div class="error">
              Article not found.
            </div>
          `;

          return;
        }

        const keyPoints =
          Array.isArray(article.keyPoints)
            ? article.keyPoints
            : [];

        const tags =
          Array.isArray(article.tags)
            ? article.tags
            : [];

        container.className =
          "article";

        container.innerHTML = `

          <div class="meta">

            <span class="category">
              ${escapeHTML(
                article.category || "News"
              )}
            </span>

            <span>
              ${formatDate(
                article.publishedAt
              )}
            </span>

          </div>

          <h1>
            ${escapeHTML(
              article.headline
            )}
          </h1>

          <p class="summary">
            ${escapeHTML(
              article.summary
            )}
          </p>

          ${
            keyPoints.length
              ? `
                <div class="key-points">

                  <h2>
                    Key Points
                  </h2>

                  <ul>
                    ${keyPoints
                      .map(
                        point => `
                          <li>
                            ${escapeHTML(
                              point
                            )}
                          </li>
                        `
                      )
                      .join("")}
                  </ul>

                </div>
              `
              : ""
          }

          <div class="article-body">
            ${formatArticle(
              article.article
            )}
          </div>

          ${
            tags.length
              ? `
                <div class="tags">
                  ${tags
                    .map(
                      tag => `
                        <span class="tag">
                          #${escapeHTML(tag)}
                        </span>
                      `
                    )
                    .join("")}
                </div>
              `
              : ""
          }

        `;

        document.title =
          `${article.headline} - News-Express`;

      })

      .catch(error => {

        console.error(error);

        container.innerHTML = `
          <div class="error">
            Unable to load this article.
          </div>
        `;

      });

  }

</script>

</body>
</html>
