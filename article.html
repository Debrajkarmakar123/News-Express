<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  News-Express Article
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  background: #f4f4f4;

  font-family: Arial, sans-serif;

  color: #171717;
}

.header {
  background: #111;

  color: #fff;

  padding: 18px 5%;
}

.logo {
  color: #f22;

  font-weight: 900;

  font-size: 28px;
}

.wrap {
  max-width: 900px;

  margin: 25px auto;

  padding: 0 15px;
}

.article {
  background: #fff;

  padding: 28px;

  border-radius: 10px;
}

.meta {
  color: #777;

  font-size: 13px;

  margin-bottom: 12px;
}

.hero {
  width: 100%;

  max-height: 500px;

  object-fit: cover;

  border-radius: 8px;

  margin: 10px 0 22px;
}

.summary {
  font-size: 19px;

  line-height: 1.7;

  font-weight: 600;

  color: #444;

  border-left: 4px solid #d00;

  padding-left: 15px;
}

.points {
  background: #f7f7f7;

  padding: 18px 25px;

  border-radius: 8px;

  margin: 22px 0;
}

.points li {
  margin: 8px 0;
}

.body {
  font-size: 18px;

  line-height: 1.85;
}

.body h2 {
  font-size: 25px;

  margin-top: 30px;
}

.video {
  margin: 25px 0;
}

.video iframe {
  width: 100%;

  aspect-ratio: 16 / 9;

  border: 0;

  border-radius: 8px;
}

.video video {
  width: 100%;

  border-radius: 8px;
}

a.back {
  display: inline-block;

  margin-bottom: 15px;

  color: #d00;

  text-decoration: none;

  font-weight: 700;
}

.tags {
  margin-top: 25px;
}

.tag {
  display: inline-block;

  background: #eee;

  padding: 5px 9px;

  border-radius: 20px;

  margin: 4px;

  font-size: 12px;
}

@media (max-width: 600px) {

  .article {
    padding: 18px;
  }

  .body {
    font-size: 16px;
  }

}

</style>

</head>

<body>

<header class="header">

<div class="logo">
NEWS-EXPRESS
</div>

</header>

<main class="wrap">

<a
  class="back"
  href="index.html"
>
← Back to News
</a>

<article
  class="article"
  id="article"
>
Loading...
</article>

</main>

<script>

const esc = value =>
  String(value ?? "")
    .replace(
      /[&<>'"]/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[char])
    );

function formatArticle(text = "") {

  return text
    .split(/\n\s*\n/)
    .map(paragraph => {

      const value =
        paragraph.trim();

      if (!value) {
        return "";
      }

      if (
        value.startsWith("## ")
      ) {

        return `
          <h2>
            ${esc(
              value.slice(3)
            )}
          </h2>
        `;

      }

      return `
        <p>
          ${esc(value)
            .replace(
              /\n/g,
              "<br>"
            )}
        </p>
      `;

    })
    .join("");
}

function videoHTML(url = "") {

  if (!url) {
    return "";
  }

  if (
    /youtube\.com|youtu\.be/i.test(
      url
    )
  ) {

    let videoId = "";

    try {

      const parsed =
        new URL(url);

      if (
        parsed.hostname.includes(
          "youtu.be"
        )
      ) {

        videoId =
          parsed.pathname.slice(1);

      } else {

        videoId =
          parsed.searchParams.get(
            "v"
          );
      }

    } catch {
      return "";
    }

    if (!videoId) {
      return "";
    }

    return `

<div class="video">

<iframe
  src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}"
  title="News video"
  allowfullscreen
></iframe>

</div>

`;

  }

  return `

<div class="video">

<video
  controls
  src="${esc(url)}"
></video>

</div>

`;

}

const id =
  new URLSearchParams(
    location.search
  ).get("id");

fetch(
  "news.json",
  {
    cache: "no-store"
  }
)

.then(response => {

  if (!response.ok) {
    throw new Error(
      "news.json failed"
    );
  }

  return response.json();
})

.then(data => {

  const item =
    data.find(
      news =>
        String(news.id) ===
        String(id)
    );

  if (!item) {

    document.getElementById(
      "article"
    ).innerHTML =
      "<h2>Article nahi mila.</h2>";

    return;
  }

  document.title =
    `${item.headline} - News-Express`;

  document.getElementById(
    "article"
  ).innerHTML = `

<div class="meta">

${esc(
  item.category ||
  "News"
)}

•

${esc(
  item.publishedAt
    ? new Date(
        item.publishedAt
      ).toLocaleString(
        "en-IN"
      )
    : ""
)}

</div>

<h1>
${esc(item.headline)}
</h1>

${
  item.image
    ? `
<img
  class="hero"
  src="${esc(item.image)}"
  alt="${esc(item.headline)}"
  onerror="this.style.display='none'"
>
`
    : ""
}

<div class="summary">

${esc(item.summary)}

</div>

${
  Array.isArray(
    item.keyPoints
  ) &&
  item.keyPoints.length

    ? `

<div class="points">

<strong>
Key Points
</strong>

<ul>

${item.keyPoints
  .map(
    point =>
      `<li>${esc(point)}</li>`
  )
  .join("")}

</ul>

</div>

`

    : ""
}

${videoHTML(item.video)}

<div class="body">

${formatArticle(
  item.article ||
  item.summary
)}

</div>

<div class="tags">

${
  (item.tags || [])
    .map(
      tag =>
        `<span class="tag">#${esc(tag)}</span>`
    )
    .join("")
}

</div>

`;

})

.catch(() => {

  document.getElementById(
    "article"
  ).textContent =
    "Article load nahi ho paaya.";

});

</script>

</body>

</html>
