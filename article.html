```html
<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>News-Express - Article</title>

    <style>

        :root {
            --primary: #cc0000;
            --dark: #1a1a1a;
            --bg: #f3f3f3;
            --text: #222;
            --muted: #666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,

        }

        body {
            background: var(--bg);

</head>

<body>


<header>

    <div class="header-container">

        <div class="logo">
            News-Express
        </div>

        <div class="tagline">
            Latest News • Trusted Updates
        </div>

    </div>

</header>


<nav>

    <div class="nav-container">

        <a href="index.html">
            ← Latest News
        </a>

    </div>

</nav>


<main>

    <a
        href="index.html"
        class="back"
    >
        ← Latest News par wapas jao
    </a>


    <div id="article-container">

        <div class="not-found">

            <p>
                Article load ho raha hai...
            </p>

        </div>

    </div>

</main>


<footer>

    News-Express © 2026

</footer>


<script>


function escapeHTML(value = "") {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function createSlug(text = "") {

    return String(text)
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 120);
}


function getArticleSlug(article) {

    if (article.slug) {
        return article.slug;
    }

    return createSlug(
        article.headline ||
        article.originalTitle ||
        article.title ||
        "news"
    );
}


function formatDate(date) {

    const parsed =
        new Date(date);

    if (Number.isNaN(parsed.getTime())) {
        return "Date unavailable";
    }

    return parsed.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/*
    Get slug from URL.

    Example:
    article.html?slug=india-announces-new-policy
*/
const params =
    new URLSearchParams(
        window.location.search
    );

const requestedSlug =
    params.get("slug");


const container =
    document.getElementById(
        "article-container"
    );


if (!requestedSlug) {

    showNotFound();

} else {

    loadArticle(requestedSlug);

}


function loadArticle(slug) {

    fetch(
        "news.json?v=" +
        Date.now()
    )

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "news.json could not be loaded"
                );
            }

            return response.json();
        })

        .then(data => {

            if (!Array.isArray(data)) {
                throw new Error(
                    "Invalid news.json format"
                );
            }


            /*
                First try exact saved slug.
            */
            let article =
                data.find(
                    item =>
                        item.slug === slug
                );


            /*
                Compatibility:
                Old article may not have slug.
            */
            if (!article) {

                article =
                    data.find(item =>
                        getArticleSlug(item) === slug
                    );

            }


            if (!article) {

                showNotFound();

                return;
            }


            renderArticle(article);

        })

        .catch(error => {

            console.error(error);

            container.innerHTML = `

                <div class="not-found">

                    <h1>
                        Article load nahi hua
                    </h1>

                    <p>
                        News data load karne mein
                        problem aa gayi.
                    </p>

                    <a
                        href="index.html"
                        class="source-link"
                    >
                        Latest News
                    </a>

                </div>

            `;

        });

}


function renderArticle(article) {

    const headline =
        article.headline ||
        article.originalTitle ||
        article.title ||
        "Untitled News";


    const summary =
        article.summary ||
        article.description ||
        article.snippet ||
        "No summary available.";


    const category =
        article.category ||
        "Other";


    const source =
        article.source ||
        "News Feed";


    const publishedAt =
        article.publishedAt ||
        article.date;


    const originalTitle =
        article.originalTitle ||
        article.title ||
        "";


    const tags =
        Array.isArray(article.tags)
            ? article.tags
            : [];


    let tagsHTML = "";

    if (tags.length > 0) {

        tagsHTML = `

            <div class="tags">

                ${tags
                    .map(tag => `
                        <span class="tag">
                            #${escapeHTML(tag)}
                        </span>
                    `)
                    .join("")
                }

            </div>

        `;

    }


    let sourceHTML = "";

    /*
        Original RSS article link.
        We only show it if a valid URL exists.
    */
    if (
        article.url &&
        /^https?:\/\//i.test(article.url)
    ) {

        sourceHTML = `

            <div class="source-box">

                <strong>
                    Original Source
                </strong>

                <p
                    style="
                        color:#666;
                        font-size:13px;
                        margin-top:5px;
                    "
                >
                    Full original report ke liye
                    source website visit karein.
                </p>

                <a
                    class="source-link"
                    href="${escapeHTML(article.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Read Original Source →
                </a>

            </div>

        `;

    }


    container.innerHTML = `

        <article class="article">

            <div class="meta">

                <span class="category">
                    ${escapeHTML(category)}
                </span>

                <span>
                    📰 ${escapeHTML(source)}
                </span>

                <span>
                    📅 ${escapeHTML(
                        formatDate(publishedAt)
                    )}
                </span>

            </div>


            <h1>
                ${escapeHTML(headline)}
            </h1>


            <div class="summary">

                ${escapeHTML(summary)}

            </div>


            ${tagsHTML}


            ${
                originalTitle &&
                originalTitle !== headline
                    ? `
                        <div
                            style="
                                margin-top:20px;
                                color:#666;
                                font-size:13px;
                            "
                        >
                            <strong>
                                Original headline:
                            </strong>

                            ${escapeHTML(
                                originalTitle
                            )}
                        </div>
                    `
                    : ""
            }


            ${sourceHTML}

        </article>

    `;


    document.title =
        headline +
        " - News-Express";

}


function showNotFound() {

    container.innerHTML = `

        <div class="not-found">

            <h1>
                Article nahi mila
            </h1>

            <p>
                Ye news available nahi hai
                ya URL galat hai.
            </p>

            <a
                href="index.html"
                class="source-link"
            >
                ← Latest News par wapas jao
            </a>

        </div>

    `;

}


</script>

</body>
</html>
