```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News-Express Article</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;

<body>

<header>
    <div class="header-container">
        <div class="logo">NEWS-EXPRESS</div>
    </div>
</header>

<nav>
    <div class="nav-container">
        <a href="index.html">← Back to News</a>
    </div>
</nav>

<div class="article-container">

    <article class="article" id="article">
        Loading article...
    </article>

</div>

<footer>
    News-Express
</footer>

<script>
function escapeHTML(value = "") {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDate(date) {
    const d = new Date(date);

    if (Number.isNaN(d.getTime())) {
        return "";
    }

    return d.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

function formatArticle(text = "") {
    const lines = text.split("\n");

    let html = "";

    for (const line of lines) {

        const clean = escapeHTML(
            line.trim()
        );

        if (!clean) {
            continue;
        }

        if (clean.startsWith("## ")) {
            html += `
                <h2>
                    ${clean.substring(3)}
                </h2>
            `;
        } else {
            html += `
                <p>
                    ${clean}
                </p>
            `;
        }
    }

    return html;
}

function youtubeEmbed(url) {
    try {
        const u = new URL(url);

        let videoId = "";

        if (
            u.hostname.includes("youtube.com")
        ) {
            videoId = u.searchParams.get("v") || "";
        }

        if (
            u.hostname === "youtu.be"
        ) {
            videoId =
                u.pathname.replace("/", "");
        }

        if (!videoId) {
            return "";
        }

        return `
            <div class="video-box">
                <iframe
                    src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}"
                    title="News video"
                    allowfullscreen>
                </iframe>
            </div>
        `;
    } catch {
        return "";
    }
}

const id =
    new URLSearchParams(
        window.location.search
    ).get("id");

if (!id) {
    document.getElementById("article").innerHTML =
        "<h1>Article not found</h1>";
} else {

    fetch("news.json")
        .then(res => res.json())
        .then(data => {

            const item = data.find(
                news => String(news.id) === String(id)
            );

            if (!item) {
                document.getElementById(
                    "article"
                ).innerHTML =
                    "<h1>Article not found</h1>";

                return;
            }

            let imageHTML = "";

            if (item.image) {
                imageHTML = `
                    <img
                        class="hero-image"
                        src="${escapeHTML(item.image)}"
                        alt="${escapeHTML(item.headline || "News image")}"
                    >
                `;
            }

            let videoHTML = "";

            if (item.video) {

                if (
                    /youtube\.com|youtu\.be/i
                        .test(item.video)
                ) {
                    videoHTML =
                        youtubeEmbed(item.video);
                } else {

                    videoHTML = `
                        <div class="video-box">
                            <video
                                controls
                                preload="metadata"
                                src="${escapeHTML(item.video)}">
                            </video>
                        </div>
                    `;
                }
            }

            let keyPointsHTML = "";

            if (
                Array.isArray(item.keyPoints) &&
                item.keyPoints.length
            ) {

                keyPointsHTML = `
                    <div class="key-points">
                        <h3>Key Points</h3>

                        <ul>
                            ${item.keyPoints
                                .map(
                                    point =>
                                        `<li>${escapeHTML(point)}</li>`
                                )
                                .join("")}
                        </ul>
                    </div>
                `;
            }

            let tagsHTML = "";

            if (
                Array.isArray(item.tags) &&
                item.tags.length
            ) {

                tagsHTML = `
                    <div class="tags">
                        ${item.tags
                            .map(
                                tag =>
                                    `<span class="tag">#${escapeHTML(tag)}</span>`
                            )
                            .join("")}
                    </div>
                `;
            }

            document.title =
                `${item.headline} - News-Express`;

            document.getElementById(
                "article"
            ).innerHTML = `

                <div class="category">
                    ${escapeHTML(
                        item.category || "News"
                    )}
                </div>

                <h1>
                    ${escapeHTML(
                        item.headline ||
                        item.originalTitle ||
                        "Untitled"
                    )}
                </h1>

                <div class="date">
                    ${escapeHTML(
                        formatDate(item.publishedAt)
                    )}
                </div>

                ${imageHTML}

                <div class="summary">
                    ${escapeHTML(
                        item.summary || ""
                    )}
                </div>

                ${videoHTML}

                ${keyPointsHTML}

                <div class="article-body">
                    ${formatArticle(
                        item.article || ""
                    )}
                </div>

                ${tagsHTML}
            `;
        })
        .catch(error => {

            console.error(error);

            document.getElementById(
                "article"
            ).innerHTML =
                "<h1>Article load nahi ho raha.</h1>";
        });
}
</script>

</body>
</html>
