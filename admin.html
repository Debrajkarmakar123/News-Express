```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News-Express Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .login-box h1 {
      margin-bottom: 8px;
    }

    .login-box p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .login-btn {
      width: 100%;
      background: #111;
      color: white;
    }

    .error {
      color: #d00;
      margin-top: 12px;
      display: none;
    }

    .admin-panel {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout {
      background: #fff;
      color: #111;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e9ecef;
      color: #111;
    }

    .settings {
      margin-top: 25px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-row input {
      width: 100px;
      margin: 0;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #f1f3f5;
      border-radius: 8px;
      color: #555;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header {
        gap: 15px;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>News-Express</h1>
      <p>Admin Control Panel</p>

      <input
        type="password"
        id="password"
        placeholder="Admin Password"
      >

      <button class="login-btn" onclick="login()">
        Login
      </button>

      <div class="error" id="loginError">
        Invalid password.
      </div>
    </div>
  </div>


  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="adminPanel">

    <header>
      <h2>News-Express Admin</h2>

      <button class="logout" onclick="logout()">
        Logout
      </button>
    </header>

    <main>

      <div class="stats">

        <div class="card">
          <h3>Total Articles</h3>
          <div class="number" id="totalArticles">0</div>
        </div>

        <div class="card">
          <h3>Articles Per Run</h3>
          <div class="number" id="articlesPerRun">10</div>
        </div>

        <div class="card">
          <h3>Auto Update</h3>
          <div class="number" id="autoStatus">ON</div>
        </div>

      </div>


      <div class="card">

        <h2>News Controls</h2>

        <br>

        <div class="controls">

          <button class="primary" onclick="fetchNews()">
            🔄 Fetch News Now
          </button>

          <button class="secondary" onclick="toggleAutoUpdate()">
            ⏸ Toggle Auto Update
          </button>

        </div>

        <div class="status" id="status">
          Ready.
        </div>

      </div>


      <div class="card settings">

        <h2>Settings</h2>

        <div class="setting-row">
          <span>Articles per run</span>

          <input
            type="number"
            id="runCount"
            value="10"
            min="1"
            max="20"
            onchange="saveSettings()"
          >
        </div>

        <div class="setting-row">
          <span>Update interval</span>

          <span>30 minutes</span>
        </div>

      </div>

    </main>

  </div>


  <script>

    /*
      IMPORTANT:
      Ye temporary frontend login gate hai.

      Is password ko real security mat samajhna.
      Production mein authentication backend par hoga.
    */

    const DEMO_PASSWORD = "Debraj";

    function login() {

      const password =
        document.getElementById("password").value;

      if (password === DEMO_PASSWORD) {

        sessionStorage.setItem(
          "newsExpressAdmin",
          "true"
        );

        showAdmin();

      } else {

        document.getElementById("loginError").style.display =
          "block";

      }
    }


    function showAdmin() {

      document.getElementById("loginScreen").style.display =
        "none";

      document.getElementById("adminPanel").style.display =
        "block";

      loadNewsStats();
    }


    function logout() {

      sessionStorage.removeItem(
        "newsExpressAdmin"
      );

      location.reload();
    }


    function fetchNews() {

      document.getElementById("status").textContent =
        "News update requested. Backend connection will be added next.";
    }


    function toggleAutoUpdate() {

      const status =
        document.getElementById("autoStatus");

      if (status.textContent === "ON") {

        status.textContent = "OFF";

      } else {

        status.textContent = "ON";

      }
    }


    function saveSettings() {

      const count =
        document.getElementById("runCount").value;

      document.getElementById("articlesPerRun").textContent =
        count;

      localStorage.setItem(
        "articlesPerRun",
        count
      );

      document.getElementById("status").textContent =
        "Settings saved locally.";
    }


    async function loadNewsStats() {

      try {

        const response =
          await fetch("news.json");

        const news =
          await response.json();

        document.getElementById("totalArticles").textContent =
          Array.isArray(news) ? news.length : 0;

      } catch (error) {

        document.getElementById("totalArticles").textContent =
          "—";
      }

      const savedCount =
        localStorage.getItem("articlesPerRun");

      if (savedCount) {

        document.getElementById("runCount").value =
          savedCount;

        document.getElementById("articlesPerRun").textContent =
          savedCount;
      }
    }


    if (
      sessionStorage.getItem("newsExpressAdmin") === "true"
    ) {

      showAdmin();

    }

  </script>

</body>
</html>
```
