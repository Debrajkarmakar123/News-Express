<!-- GitHub Actions Progress -->
<div class="card">
  <h2>⚙️ Workflow Progress</h2>

  <div id="workflowStatus">Checking...</div>

  <div class="progress-box">
    <div id="workflowProgressBar" class="progress-bar"></div>
  </div>

  <div id="workflowProgressText">0%</div>

  <div id="workflowSteps"></div>

  <button onclick="refreshWorkflow()" class="btn">
    🔄 Refresh
  </button>

  <a
    id="githubActionsBtn"
    href="#"
    target="_blank"
    class="btn"
    style="display:none"
  >
    Open GitHub Actions
  </a>
</div>

<script>
const GITHUB_OWNER = location.hostname.split(".")[0];
const GITHUB_REPO = location.pathname.split("/")[1];
const WORKFLOW_FILE = "update.yml";

async function refreshWorkflow() {
  const status = document.getElementById("workflowStatus");
  const bar = document.getElementById("workflowProgressBar");
  const text = document.getElementById("workflowProgressText");
  const stepsBox = document.getElementById("workflowSteps");
  const actionsBtn = document.getElementById("githubActionsBtn");

  if (!GITHUB_OWNER || !GITHUB_REPO) {
    status.textContent = "GitHub repository not detected";
    return;
  }

  try {
    status.textContent = "Checking GitHub Actions...";

    const runsURL =
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}` +
      `/actions/workflows/${WORKFLOW_FILE}/runs?per_page=1`;

    const response = await fetch(runsURL);

    if (!response.ok) {
      throw new Error("GitHub API error");
    }

    const data = await response.json();

    if (!data.workflow_runs || data.workflow_runs.length === 0) {
      status.textContent = "No workflow runs found";
      return;
    }

    const run = data.workflow_runs[0];

    actionsBtn.href = run.html_url;
    actionsBtn.style.display = "inline-block";

    const jobsURL =
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}` +
      `/actions/runs/${run.id}/jobs?per_page=20`;

    const jobsResponse = await fetch(jobsURL);
    const jobsData = await jobsResponse.json();

    let steps = [];

    if (jobsData.jobs) {
      jobsData.jobs.forEach(job => {
        if (job.steps) {
          steps = steps.concat(job.steps);
        }
      });
    }

    const completed = steps.filter(
      step =>
        step.status === "completed"
    ).length;

    const total = steps.length;

    let progress = 0;

    if (total > 0) {
      progress = Math.round((completed / total) * 100);
    }

    if (run.status === "completed") {
      progress = 100;
    }

    bar.style.width = progress + "%";
    text.textContent = progress + "%";

    if (run.status === "completed") {
      status.textContent =
        run.conclusion === "success"
          ? "✅ Workflow completed successfully"
          : "❌ Workflow failed";
    } else if (run.status === "in_progress") {
      status.textContent = "🔄 Workflow running...";
    } else {
      status.textContent = "⏳ Workflow queued...";
    }

    stepsBox.innerHTML = "";

    steps.forEach(step => {
      let icon = "⏳";

      if (step.status === "completed") {
        icon =
          step.conclusion === "success"
            ? "✅"
            : "❌";
      } else if (step.status === "in_progress") {
        icon = "🔄";
      }

      const div = document.createElement("div");

      div.style.padding = "8px";
      div.style.marginTop = "5px";
      div.style.borderRadius = "8px";
      div.style.background = "#f3f4f6";

      div.innerHTML =
        `${icon} <b>${step.name}</b>` +
        `<br><small>${step.status || ""}</small>`;

      stepsBox.appendChild(div);
    });

  } catch (error) {
    console.error(error);

    status.textContent =
      "⚠️ Unable to read GitHub Actions";
  }
}

refreshWorkflow();

setInterval(
  refreshWorkflow,
  10000
);
</script>
