```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News-Express - Latest News</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

header {
    background: #fff;
    border-bottom: 3px solid #cc0000;
}

.header-container {
    max-width: 1100px;
    margin: auto;
    padding: 20px 15px;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    color: #cc0000;
}

.tagline {
    color: #666;
    font-size: 13px;
    margin-top: 4px;
}

nav {
    background: #1a1a1a;
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    display: flex;
    overflow-x: auto;
}

.nav-container a {
    color: white;
    text-decoration: none;
    padding: 13px 18px;
    white-space: nowrap;
}

.nav-container a:hover {
    background: #333;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.section-header {
    border-bottom: 2px solid #cc0000;
    padding-bottom: 8px;
    margin-bottom: 20px;
}

.section-title {
    font-size: 22px;
    font-weight: bold;
}

.news-card {
    background: white;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.news-image {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
}

.news-content {
    padding: 20px;
}

.news-meta {
    font-size: 12px;
    color: #777;
    margin-bottom: 8px;
}

.news-card h2 {
    font-size: 22px;
    line-height: 1.35;
    margin-bottom: 10px;
}

.news-card p {
    color: #555;
    line-height: 1.7;
    margin-bottom: 15px;
}

.read-more {
    display: inline-block;
    background: #cc0000;
    color: white;
    padding: 9px 15px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}

.video-badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 12px;
    background: #eee;
    padding: 5px 8px;
    border-radius: 4px;
}

.no-image {
    height: 180px;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
}

footer {
    background: #1a1a1a;
    color: #aaa;
    text-align: center;
    padding: 30px;
    margin-top: 40px;
}

@media (max-width: 600px) {
    .logo {
        font-size: 27px;
    }

    .news-image {
        height: 210px;
    }

    .news-card h2 {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-container">
        <div class="logo">NEWS-EXPRESS</div>
        <div class="tagline">Latest News • Original AI Articles</div>
    </div>
</header>

<nav>
    <div class="nav-container">
        <a href="index.html">Home</a>
        <a href="index.html?category=India">India</a>
        <a href="index.html?category=Technology">Technology</a>
        <a href="index.html?category=Sports">Sports</a>
        <a href="index.html?category=Entertainment">Entertainment</a>
    </div>
</nav>

<div class="container">

    <div class="section-header">
        <div class="section-title">Latest News</div>
    </div>

    <div id="news-list">
        Loading news...
    </div>

</div>

<footer>
    <strong>News-Express</strong>
    <br><br>
    Latest news and original articles.
</footer>

<script>
function escapeHTML(value = "") {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDate(date) {
    const d = new Date(date);

    if (Number.isNaN(d.getTime())) {
        return "";
    }

    return d.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

function getCategory() {
    return new URLSearchParams(
        window.location.search
    ).get("category");
}

fetch("news.json")
    .then(res => {
        if (!res.ok) {
            throw new Error("news.json failed");
        }

        return res.json();
    })
    .then(data => {

        let news = Array.isArray(data)
            ? data
            : [];

        const category = getCategory();

        if (category) {
            news = news.filter(
                item =>
                    item.category === category
            );
        }

        // Homepage: latest 10
        news = news.slice(0, 10);

        if (!news.length) {
            document.getElementById("news-list").innerHTML =
                "<p>No news available.</p>";
            return;
        }

        let html = "";

        news.forEach(item => {

            const image = item.image
                ? `
                    <img
                        class="news-image"
                        src="${escapeHTML(item.image)}"
                        alt="${escapeHTML(item.headline || "News image")}"
                        loading="lazy"
                    >
                  `
                : `
                    <div class="no-image">
                        No image available
                    </div>
                  `;

            const videoBadge = item.video
                ? `<span class="video-badge">🎥 Video available</span>`
                : "";

            html += `
                <article class="news-card">

                    ${image}

                    <div class="news-content">

                        <div class="news-meta">
                            ${escapeHTML(item.category || "News")}
                            •
                            ${escapeHTML(formatDate(item.publishedAt))}
                            ${videoBadge}
                        </div>

                        <h2>
                            ${escapeHTML(
                                item.headline ||
                                item.originalTitle ||
                                "Untitled"
                            )}
                        </h2>

                        <p>
                            ${escapeHTML(
                                item.summary || ""
                            )}
                        </p>

                        <a
                            class="read-more"
                            href="article.html?id=${encodeURIComponent(item.id)}"
                        >
                            Read Full Article →
                        </a>

                    </div>

                </article>
            `;
        });

        document.getElementById(
            "news-list"
        ).innerHTML = html;
    })
    .catch(error => {
        console.error(error);

        document.getElementById(
            "news-list"
        ).innerHTML =
            "<p style='color:red'>News load nahi ho rahi.</p>";
    });
</script>

</body>
</html>
