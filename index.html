<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="News-Express - Latest breaking and trending news"
  >

  <title>News-Express - Latest News</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #171717;
      line-height: 1.6;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 4px;
      color: #cbd5e1;
      font-size: 14px;
    }

    nav {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav button {
      border: 0;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    nav button.active {
      background: white;
      color: #111827;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 20px;
    }

    #news-container {
      display: grid;
      gap: 18px;
    }

    .news-card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .news-card h2 {
      font-size: 23px;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .news-card h2 a {
      color: #111827;
      text-decoration: none;
    }

    .news-card h2 a:hover {
      text-decoration: underline;
    }

    .summary {
      color: #4b5563;
      font-size: 16px;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 13px;
      color: #6b7280;
    }

    .category {
      font-weight: bold;
      color: #2563eb;
    }

    .read-more {
      display: inline-block;
      margin-top: 16px;
      text-decoration: none;
      font-weight: bold;
      color: #2563eb;
    }

    .loading,
    .error,
    .empty {
      background: white;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 25px;
      }

      .news-card {
        padding: 18px;
      }

      .news-card h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      News-Express
    </div>

    <div class="tagline">
      Latest news, explained clearly
    </div>

    <nav>
      <button
        class="active"
        data-category="All"
      >
        All
      </button>

      <button data-category="India">
        India
      </button>

      <button data-category="Technology">
        Technology
      </button>

      <button data-category="Sports">
        Sports
      </button>

      <button data-category="Entertainment">
        Entertainment
      </button>
    </nav>

  </div>
</header>

<main>

  <h1 class="section-title">
    Latest News
  </h1>

  <div id="news-container">
    <div class="loading">
      Loading latest news...
    </div>
  </div>

</main>

<footer>
  © 2026 News-Express
</footer>

<script>
  let allNews = [];

  const container =
    document.getElementById("news-container");

  function escapeHTML(value = "") {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(date) {
    const d = new Date(date);

    if (Number.isNaN(d.getTime())) {
      return "";
    }

    return d.toLocaleDateString("en-IN", {
      day: "numeric",
      month: "short",
      year: "numeric"
    });
  }

  function renderNews(category = "All") {
    const filtered =
      category === "All"
        ? allNews
        : allNews.filter(
            item =>
              item.category === category
          );

    const latest = filtered.slice(0, 10);

    if (!latest.length) {
      container.innerHTML = `
        <div class="empty">
          No news available in this category.
        </div>
      `;

      return;
    }

    container.innerHTML = latest
      .map(item => {
        return `
          <article class="news-card">

            <div class="meta">
              <span class="category">
                ${escapeHTML(item.category || "News")}
              </span>

              <span>
                ${formatDate(item.publishedAt)}
              </span>
            </div>

            <h2>
              <a
                href="article.html?id=${encodeURIComponent(item.id)}"
              >
                ${escapeHTML(item.headline)}
              </a>
            </h2>

            <p class="summary">
              ${escapeHTML(item.summary)}
            </p>

            <a
              class="read-more"
              href="article.html?id=${encodeURIComponent(item.id)}"
            >
              Read Full Article →
            </a>

          </article>
        `;
      })
      .join("");
  }

  fetch("news.json", {
    cache: "no-store"
  })
    .then(response => {
      if (!response.ok) {
        throw new Error(
          "Could not load news.json"
        );
      }

      return response.json();
    })
    .then(data => {
      if (!Array.isArray(data)) {
        throw new Error(
          "news.json is not an array."
        );
      }

      allNews = data;

      renderNews("All");
    })
    .catch(error => {
      console.error(error);

      container.innerHTML = `
        <div class="error">
          Unable to load news right now.
        </div>
      `;
    });

  document
    .querySelectorAll("nav button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll("nav button")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          renderNews(
            button.dataset.category
          );
        }
      );

    });
</script>

</body>
</html>
