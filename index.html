```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News-Express</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd5e1;
    }

    nav {
      background: white;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      border: 0;
      background: #e5e7eb;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    nav button:hover {
      background: #d1d5db;
    }

    .container {
      width: min(1100px, 94%);
      margin: 30px auto;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .news-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .news-card h2 {
      font-size: 20px;
      line-height: 1.35;
      margin: 10px 0;
    }

    .news-card p {
      color: #4b5563;
      line-height: 1.55;
    }

    .meta {
      font-size: 13px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 8px;
      background: #eef2ff;
      font-size: 12px;
      font-weight: bold;
    }

    .score {
      font-size: 12px;
      font-weight: bold;
    }

    .read {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .read:hover {
      opacity: 0.85;
    }

    .empty {
      text-align: center;
      padding: 50px;
      background: white;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>📰 News-Express</h1>
  <p>Fresh • Trending • AI-powered news</p>
</header>

<nav>
  <button onclick="filterNews('All')">All</button>
  <button onclick="filterNews('India')">India</button>
  <button onclick="filterNews('Technology')">Technology</button>
  <button onclick="filterNews('Sports')">Sports</button>
  <button onclick="filterNews('Entertainment')">Entertainment</button>
</nav>

<main class="container">

  <div class="status" id="status">
    Loading latest news...
  </div>

  <div class="news-grid" id="news"></div>

</main>

<script>
  let allNews = [];

  function escapeHTML(value = "") {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderNews(category = "All") {
    const container = document.getElementById("news");

    let news = [...allNews];

    if (category !== "All") {
      news = news.filter(item => item.category === category);
    }

    if (!news.length) {
      container.innerHTML = `
        <div class="empty">
          <h2>No news found</h2>
          <p>Try another category.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = news.map(item => `
      <article class="news-card">

        <div class="meta">
          <span>${escapeHTML(item.source || "News Source")}</span>
          <span>${escapeHTML(item.date || "")}</span>
        </div>

        <span class="category">
          ${escapeHTML(item.category || "India")}
        </span>

        <h2>${escapeHTML(item.title || "Untitled")}</h2>

        <p>
          ${escapeHTML(
            item.summary ||
            item.snippet ||
            "Read the full story from the source."
          )}
        </p>

        <div class="score">
          🔥 Trending Score: ${item.trendingScore || 0}
        </div>

        <a
          class="read"
          href="${escapeHTML(item.url || "#")}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Read Full Story →
        </a>

      </article>
    `).join("");
  }

  function filterNews(category) {
    renderNews(category);
  }

  fetch("news.json?cache=" + Date.now())
    .then(response => {
      if (!response.ok) {
        throw new Error("news.json could not be loaded");
      }

      return response.json();
    })
    .then(data => {
      allNews = Array.isArray(data) ? data : [];

      document.getElementById("status").innerHTML =
        `🟢 ${allNews.length} news articles in the permanent archive`;

      renderNews();
    })
    .catch(error => {
      console.error(error);

      document.getElementById("status").innerHTML =
        "❌ News could not be loaded. Please try again later.";
    });
</script>

</body>
</html>
