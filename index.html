<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News-Express - Latest News</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #171717;
}

.top {
  background: #111;
  color: #fff;
  padding: 8px 5%;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.live {
  background: #d00;
  color: #fff;
  padding: 3px 8px;
  border-radius: 4px;
}

.header {
  background: #fff;
  border-bottom: 3px solid #d00;
  padding: 20px 5%;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  color: #d00;
}

.tagline {
  color: #666;
  font-size: 12px;
  margin-top: 4px;
}

.nav {
  background: #171717;
  overflow: auto;
  white-space: nowrap;
}

.nav a {
  display: inline-block;
  color: #fff;
  text-decoration: none;
  padding: 13px 18px;
}

.nav a:hover {
  background: #333;
}

.layout {
  max-width: 1150px;
  margin: 25px auto;
  padding: 0 15px;

  display: grid;
  grid-template-columns: 2.4fr 1fr;
  gap: 25px;
}

.section {
  font-size: 22px;
  font-weight: 800;

  border-bottom: 3px solid #d00;

  padding-bottom: 8px;
  margin-bottom: 18px;
}

.card {
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 18px;

  box-shadow:
    0 2px 10px #0000000d;
}

.card-img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  background: #ddd;
  display: block;
}

.card-body {
  padding: 18px;
}

.meta {
  font-size: 12px;
  color: #777;
  margin-bottom: 8px;
}

.card h2 {
  font-size: 22px;
  line-height: 1.3;
  margin-bottom: 10px;
}

.card p {
  color: #555;
  line-height: 1.6;
}

.read {
  display: inline-block;
  margin-top: 14px;

  background: #d00;
  color: #fff;

  text-decoration: none;

  padding: 9px 14px;
  border-radius: 5px;

  font-weight: 700;
}

.side {
  background: #fff;
  padding: 18px;
  border-radius: 8px;
  margin-bottom: 18px;
}

.side h3 {
  margin-bottom: 12px;
}

.side a {
  display: block;

  color: #222;
  text-decoration: none;

  padding: 10px 0;

  border-bottom: 1px solid #eee;
}

.side a:hover {
  color: #d00;
}

@media (max-width: 800px) {

  .layout {
    grid-template-columns: 1fr;
  }

  .logo {
    font-size: 28px;
  }

  .card-img {
    height: 190px;
  }
}
</style>
</head>

<body>

<div class="top">
  <span id="date"></span>
  <span class="live">● LIVE UPDATES</span>
</div>

<header class="header">
  <div class="logo">NEWS-EXPRESS</div>

  <div class="tagline">
    Fast • Original • Detailed News
  </div>
</header>

<nav class="nav">
  <a href="index.html">Home</a>
  <a href="index.html?category=India">India</a>
  <a href="index.html?category=Technology">Technology</a>
  <a href="index.html?category=Sports">Sports</a>
  <a href="index.html?category=Entertainment">Entertainment</a>
</nav>

<div class="layout">

<main>

<div class="section">
  Latest News
</div>

<div id="news-list">
  Loading news...
</div>

</main>

<aside>

<div class="side">

<h3>🔥 Trending</h3>

<div id="trending">
  Loading...
</div>

</div>

<div class="side">

<h3>News-Express</h3>

<p>
Fresh original articles are automatically updated from verified news feeds.
</p>

</div>

</aside>

</div>

<script>

const esc = value =>
  String(value ?? "")
    .replace(
      /[&<>'"]/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[char])
    );

const dateText = date => {

  if (!date) {
    return "";
  }

  return new Date(date)
    .toLocaleString(
      "en-IN",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
};

document.getElementById(
  "date"
).textContent =
  new Date().toLocaleDateString(
    "en-IN",
    {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

fetch(
  "news.json",
  {
    cache: "no-store"
  }
)

.then(response => {

  if (!response.ok) {
    throw new Error(
      "news.json failed"
    );
  }

  return response.json();
})

.then(data => {

  const category =
    new URLSearchParams(
      location.search
    ).get("category");

  const filtered =
    category
      ? data.filter(
          item =>
            item.category ===
            category
        )
      : data;

  const news =
    filtered.slice(0, 10);

  document.getElementById(
    "news-list"
  ).innerHTML =

    news.length

      ? news.map(item => `

<article class="card">

  ${
    item.image
      ? `
      <img
        class="card-img"
        src="${esc(item.image)}"
        alt="${esc(item.headline)}"
        loading="lazy"
        onerror="this.style.display='none'"
      >
      `
      : ""
  }

  <div class="card-body">

    <div class="meta">

      ${esc(
        item.category ||
        "News"
      )}

      •
      ${esc(
        dateText(
          item.publishedAt
        )
      )}

      ${
        item.video
          ? " • 🎥 Video"
          : ""
      }

    </div>

    <h2>
      ${esc(item.headline)}
    </h2>

    <p>
      ${esc(item.summary)}
    </p>

    <a
      class="read"
      href="article.html?id=${encodeURIComponent(item.id)}"
    >
      Read Full Article →
    </a>

  </div>

</article>

`).join("")

      : "<p>No news available yet.</p>";

  const trending =
    data.slice(0, 5);

  document.getElementById(
    "trending"
  ).innerHTML =

    trending
      .map(item => `

<a href="article.html?id=${encodeURIComponent(item.id)}">

  ${esc(item.headline)}

</a>

`)
      .join("");
})

.catch(() => {

  document.getElementById(
    "news-list"
  ).textContent =
    "News load nahi ho paayi.";

});

</script>

</body>
</html>
